<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Para Osiris</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: #fffaf0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #04060d;
    }
    main {
      position: fixed;
      inset: 0;
      display: grid;
      align-items: center;
      padding: clamp(1.2rem, 5vw, 5rem);
      isolation: isolate;
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 211, 107, 0.26), transparent 30%),
        radial-gradient(circle at 78% 25%, rgba(255, 122, 168, 0.22), transparent 32%),
        radial-gradient(circle at 62% 80%, rgba(142, 232, 255, 0.18), transparent 34%),
        linear-gradient(145deg, #070b17, #120914 48%, #07160f);
    }
    main::before {
      content: "";
      position: absolute;
      inset: -12%;
      z-index: -1;
      background-image:
        linear-gradient(90deg, rgba(255,255,255,.18) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.14) 1px, transparent 1px);
      background-size: 58px 58px;
      opacity: .08;
      transform: rotate(-8deg);
    }
    main::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 55% 52%, transparent 0 34%, rgba(0,0,0,.34) 72%),
        linear-gradient(90deg, rgba(0,0,0,.56), transparent 46%, rgba(0,0,0,.32));
    }
    .stars {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: -1;
    }
    .stars i {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 16px rgba(255,255,255,.9);
      animation: floatStar linear infinite;
    }
    @keyframes floatStar {
      from { transform: translate3d(0, 110vh, 0); opacity: 0; }
      12% { opacity: 1; }
      to { transform: translate3d(var(--x), -14vh, 0); opacity: 0; }
    }
    .content {
      width: min(850px, 100%);
    }
    .eyebrow {
      margin: 0 0 1rem;
      color: #ffd36b;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0;
      text-shadow: 0 0 22px rgba(255,211,107,.42);
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 8vw, 7rem);
      line-height: .98;
      letter-spacing: 0;
      text-wrap: balance;
      text-shadow:
        0 0 2px rgba(255,255,255,.85),
        0 0 34px rgba(142,232,255,.24),
        0 30px 80px rgba(0,0,0,.65);
    }
    p {
      width: min(640px, 100%);
      margin: 1.25rem 0 1.8rem;
      color: #dde5f4;
      font-size: clamp(1rem, 1.6vw, 1.22rem);
      line-height: 1.6;
    }
    .actions {
      display: flex;
      gap: .8rem;
      flex-wrap: wrap;
    }
    .btn {
      appearance: none;
      border: 1px solid rgba(255,211,107,.7);
      border-radius: 999px;
      min-height: 48px;
      min-width: 176px;
      padding: .8rem 1.25rem;
      color: #1b1308;
      background: linear-gradient(135deg, #ffe08a, #ffb86b);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 16px 38px rgba(255,184,107,.24);
    }
    .btn.secondary {
      color: #fffaf0;
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.24);
      box-shadow: none;
      backdrop-filter: blur(12px);
    }
    .flower-orbit {
      position: absolute;
      right: clamp(-4rem, 7vw, 7rem);
      bottom: clamp(3rem, 8vh, 8rem);
      width: clamp(220px, 30vw, 420px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: inset 0 0 60px rgba(255,255,255,.06), 0 0 80px rgba(255,122,168,.16);
      animation: spin 24s linear infinite;
    }
    .flower-orbit span {
      position: absolute;
      left: 50%;
      top: 50%;
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      transform: rotate(var(--a)) translateX(clamp(92px, 14vw, 192px)) rotate(calc(var(--a) * -1));
      filter: drop-shadow(0 0 18px rgba(255,255,255,.35));
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 720px) {
      main { align-items: start; padding-top: 5rem; }
      .actions { display: grid; }
      .flower-orbit { opacity: .42; right: -7rem; bottom: 2rem; }
    }
  </style>
</head>
<body>
  <main>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <div class="flower-orbit" aria-hidden="true">
      <span style="--a:0deg">&#x1F337;</span>
      <span style="--a:72deg">&#x1F338;</span>
      <span style="--a:144deg">&#x1F33C;</span>
      <span style="--a:216deg">&#x1F339;</span>
      <span style="--a:288deg">&#x273F;</span>
    </div>
    <section class="content" aria-label="Felicitaci&oacute;n para Osiris">
      <p class="eyebrow">Felicitaci&oacute;n especial</p>
      <h1>Para Osiris.</h1>
      <p>Un peque&ntilde;o recorrido hecho para celebrar tu t&iacute;tulo: cielo, flores, m&uacute;sica, juegos, mar, pintura, dulzura, espacio y un cierre donde todo termina mirando hacia tu sonrisa.</p>
      <div class="actions">
        <button class="btn" id="start" type="button">Abrir felicitaci&oacute;n</button>
      </div>
    </section>
  </main>
  <script>
    const stars = document.getElementById("stars");
    for (let i = 0; i < 90; i++) {
      const star = document.createElement("i");
      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";
      star.style.setProperty("--x", (Math.random() * 140 - 70).toFixed(1) + "px");
      star.style.animationDuration = (8 + Math.random() * 12).toFixed(2) + "s";
      star.style.animationDelay = (-Math.random() * 16).toFixed(2) + "s";
      star.style.opacity = (0.35 + Math.random() * 0.65).toFixed(2);
      stars.appendChild(star);
    }
    document.getElementById("start").addEventListener("click", () => location.href = "presentacion.html");
  </script>
</body>
</html>
