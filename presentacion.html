<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="prefetch" href="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js" as="script">
  <title>Felicitaci&oacute;n para Osiris</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --fg: #fffaf0;
      --muted: #aeb8c9;
      --line: rgba(255,255,255,.2);
      --panel: rgba(5,7,13,.66);
      --transition: 880ms;
    }
    html, body { height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: #000;
      color: var(--fg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    .stage {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
    }
    .layer,
    .layer iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
    .layer {
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition) ease;
    }
    .layer.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .anim-enter,
    .anim-exit {
      animation-duration: var(--transition);
      animation-fill-mode: both;
      animation-timing-function: cubic-bezier(.2,.72,.2,1);
    }
    @keyframes fadeIn { from { opacity: .2; transform: scale(1.025); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: .2; transform: scale(.985); } }
    @keyframes riseIn { from { transform: translateY(7%); opacity: .24; } to { transform: translateY(0); opacity: 1; } }
    @keyframes riseOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-5%); opacity: .24; } }
    @keyframes sweepIn { from { transform: translateX(8%) scale(1.02); opacity: .24; } to { transform: translateX(0) scale(1); opacity: 1; } }
    @keyframes sweepOut { from { transform: translateX(0) scale(1); opacity: 1; } to { transform: translateX(-8%) scale(.99); opacity: .24; } }
    @keyframes nearIn { from { transform: scale(1.08); filter: blur(5px); opacity: .18; } to { transform: scale(1); filter: blur(0); opacity: 1; } }
    @keyframes nearOut { from { transform: scale(1); filter: blur(0); opacity: 1; } to { transform: scale(.94); filter: blur(5px); opacity: .18; } }
    .hud {
      position: fixed;
      z-index: 30;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: .55rem;
      padding: .78rem clamp(.8rem, 3vw, 1.35rem);
      background: linear-gradient(to top, rgba(0,0,0,.78), transparent);
    }
    .btn {
      appearance: none;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--fg);
      background: var(--panel);
      padding: .58rem .9rem;
      font-weight: 820;
      cursor: pointer;
      backdrop-filter: blur(14px);
    }
    .btn:hover { border-color: rgba(255,255,255,.42); }
    .btn[aria-pressed="true"] {
      border-color: rgba(255,211,107,.75);
      color: #ffe08a;
    }
    .sep { flex: 1; }
    .time {
      color: var(--muted);
      font-size: .92rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      text-shadow: 0 2px 12px #000;
    }
    .progress {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 31;
      height: 3px;
      background: rgba(255,255,255,.14);
    }
    .progress i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #ffd36b, #8ee8ff, #ff7aa8);
      box-shadow: 0 0 18px rgba(142,232,255,.68);
    }
    .gate {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      align-items: center;
      padding: clamp(1.2rem, 5vw, 5rem);
      background:
        radial-gradient(circle at 22% 20%, rgba(255,211,107,.24), transparent 30%),
        radial-gradient(circle at 76% 78%, rgba(255,122,168,.2), transparent 34%),
        linear-gradient(145deg, #070a14, #130911 48%, #06130e);
    }
    .gate.hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 520ms ease;
    }
    .gate-inner {
      width: min(760px, 100%);
    }
    .gate h1 {
      margin: 0;
      font-size: clamp(2.6rem, 7vw, 5.4rem);
      line-height: 1.02;
      letter-spacing: 0;
      text-wrap: balance;
    }
    .gate p {
      width: min(620px, 100%);
      margin: 1.1rem 0 1.4rem;
      color: #dde5f4;
      font-size: 1.08rem;
      line-height: 1.6;
    }
    .gate .btn.primary {
      color: #1b1308;
      background: linear-gradient(135deg, #ffe08a, #ffb86b);
      border-color: rgba(255,211,107,.74);
      box-shadow: 0 16px 38px rgba(255,184,107,.22);
    }
    @media (max-width: 760px) {
      .hud {
        gap: .42rem;
        flex-wrap: wrap;
        padding-bottom: .95rem;
      }
      .btn {
        min-height: 40px;
        padding: .55rem .68rem;
      }
      .time {
        width: 100%;
        order: 4;
      }
    }
  </style>
</head>
<body>
  <audio id="bgm" playsinline preload="auto" loop src="https://www.dropbox.com/scl/fi/fi4jwiiphm9j6rk4kqwvs/Marvin-Gaye-Tammi-Terrell-Ain-t-No-Mountain-High-Enough-Sub.-Espa-ol.mp3?rlkey=d9vs9gmpe2y3pf3ha5hw6bstp&st=jbzm8o9q&raw=1"></audio>

  <main class="stage" id="stage">
    <div class="layer visible" id="layerA"><iframe id="frameA" title="Escena actual"></iframe></div>
    <div class="layer" id="layerB"><iframe id="frameB" title="Escena siguiente"></iframe></div>
  </main>

  <div class="hud" aria-label="Controles de la presentaci&oacute;n">
    <button class="btn" id="prev" type="button">Anterior</button>
    <button class="btn" id="next" type="button">Siguiente</button>
    <button class="btn" id="playPause" type="button" aria-pressed="true">Pausa</button>
    <button class="btn" id="mute" type="button" aria-pressed="false">Sonido</button>
    <div class="sep"></div>
    <div class="time"><span id="idx">1</span>/<span id="total">9</span> &middot; <span id="remaining">--</span></div>
  </div>
  <div class="progress"><i id="bar"></i></div>

  <section class="gate" id="gate" aria-label="Inicio">
    <div class="gate-inner">
      <h1>Un universo peque&ntilde;o para celebrar tu t&iacute;tulo.</h1>
      <p>Una felicitaci&oacute;n para Osiris, hecha con cielo, flores, juegos, pel&iacute;culas, mar, m&uacute;sica, pintura, dulzura y un final guardado alrededor de tu sonrisa.</p>
      <button class="btn primary" id="start" type="button">Iniciar</button>
      <button class="btn" id="startMuted" type="button">Iniciar sin sonido</button>
    </div>
  </section>

  <script>
    const SLIDES = [
      { src: "1 Cielo de Felicitacion.html", duration: 12000, transition: "fade" },
      { src: "2 Aldea de Bloques.html", duration: 12000, transition: "rise" },
      { src: "3 Campo de Flores.html", duration: 13000, transition: "sweep" },
      { src: "4 Historias y Estrellas.html", duration: 12000, transition: "near" },
      { src: "5 Mar y Atardecer.html", duration: 12000, transition: "fade" },
      { src: "6 Musica y Postres.html", duration: 12000, transition: "rise" },
      { src: "7 Pintura y Escuela.html", duration: 12000, transition: "sweep" },
      { src: "8 Puente al Universo.html", duration: 13000, transition: "near" },
      { src: "9 Universo.html", duration: 18000, transition: "fade" }
    ];

    const prefersQuiet = new URLSearchParams(location.search).get("sound") === "0";
    const TRANSITION_MS = 880;
    let current = 0;
    let active = "A";
    let playing = true;
    let muted = prefersQuiet;
    let timer = null;
    let raf = 0;
    let slideStartedAt = 0;
    let remainingMs = SLIDES[0].duration;
    const audio = document.getElementById("bgm");

    const layerA = document.getElementById("layerA");
    const layerB = document.getElementById("layerB");
    const frameA = document.getElementById("frameA");
    const frameB = document.getElementById("frameB");
    const idxEl = document.getElementById("idx");
    const totalEl = document.getElementById("total");
    const remainingEl = document.getElementById("remaining");
    const bar = document.getElementById("bar");
    const playPause = document.getElementById("playPause");
    const mute = document.getElementById("mute");
    const gate = document.getElementById("gate");

    totalEl.textContent = SLIDES.length;
    assignFrame(frameA, 0, true);
    assignFrame(frameB, 1, true);
    updateHud();

    function slideSrc(index, preload) {
      const src = SLIDES[index].src;
      const separator = src.includes("?") ? "&" : "?";
      return `${src}${separator}preload=${preload ? "1" : "0"}`;
    }

    function sendSceneControl(frame, action) {
      try {
        frame.contentWindow?.postMessage({ type: "scene-control", action }, "*");
      } catch (error) {}
    }

    function assignFrame(frame, index, preload) {
      if (index < 0 || index >= SLIDES.length) {
        frame.removeAttribute("src");
        frame.dataset.index = "";
        frame.dataset.preload = "";
        return;
      }
      frame.dataset.index = String(index);
      frame.dataset.preload = preload ? "1" : "0";
      frame.onload = () => {
        const activeFrame = active === "A" ? frameA : frameB;
        const presentationStarted = gate.classList.contains("hidden");
        const shouldPause = preload && (frame !== activeFrame || !presentationStarted);
        sendSceneControl(frame, shouldPause ? "pause" : "resume");
      };
      frame.src = slideSrc(index, preload);
    }

    function preloadNext() {
      const nextIndex = current + 1;
      const inactiveFrame = active === "A" ? frameB : frameA;
      if (nextIndex >= SLIDES.length) {
        sendSceneControl(inactiveFrame, "pause");
        return;
      }
      if (inactiveFrame.dataset.index !== String(nextIndex) || inactiveFrame.dataset.preload !== "1") {
        assignFrame(inactiveFrame, nextIndex, true);
      } else {
        sendSceneControl(inactiveFrame, "pause");
      }
    }

    function resumeActiveScene() {
      sendSceneControl(active === "A" ? frameA : frameB, "resume");
    }

    function pauseActiveScene() {
      sendSceneControl(active === "A" ? frameA : frameB, "pause");
    }

    function setMuted(value) {
      muted = value;
      mute.textContent = muted ? "Silencio" : "Sonido";
      mute.setAttribute("aria-pressed", String(!muted));
      audio.muted = muted;
      audio.volume = muted ? 0 : 0.78;
    }

    function setTransition(outFrame, inFrame, type) {
      const names = {
        fade: ["fadeOut", "fadeIn"],
        rise: ["riseOut", "riseIn"],
        sweep: ["sweepOut", "sweepIn"],
        near: ["nearOut", "nearIn"]
      }[type] || ["fadeOut", "fadeIn"];
      outFrame.className = "anim-exit";
      inFrame.className = "anim-enter";
      outFrame.style.animationName = names[0];
      inFrame.style.animationName = names[1];
      setTimeout(() => {
        outFrame.className = "";
        inFrame.className = "";
        outFrame.style.animationName = "";
        inFrame.style.animationName = "";
      }, TRANSITION_MS + 60);
    }

    function showSlide(nextIndex, manual = false) {
      if (nextIndex === current && !manual) return;
      const outgoingLayer = active === "A" ? layerA : layerB;
      const incomingLayer = active === "A" ? layerB : layerA;
      const outgoingFrame = active === "A" ? frameA : frameB;
      const incomingFrame = active === "A" ? frameB : frameA;
      if (incomingFrame.dataset.index !== String(nextIndex)) {
        assignFrame(incomingFrame, nextIndex, false);
      } else {
        incomingFrame.dataset.preload = "0";
        sendSceneControl(incomingFrame, "resume");
      }
      sendSceneControl(outgoingFrame, "pause");
      setTransition(outgoingFrame, incomingFrame, SLIDES[nextIndex].transition);
      incomingLayer.classList.add("visible");
      outgoingLayer.classList.remove("visible");
      active = active === "A" ? "B" : "A";
      current = nextIndex;
      remainingMs = SLIDES[current].duration;
      slideStartedAt = performance.now();
      updateHud();
      schedule();
      setTimeout(preloadNext, TRANSITION_MS + 90);
    }

    function next() {
      if (current >= SLIDES.length - 1) {
        playing = false;
        updateHud();
        return;
      }
      showSlide(current + 1);
    }

    function previous() {
      showSlide(Math.max(0, current - 1), true);
    }

    function schedule() {
      clearTimeout(timer);
      cancelAnimationFrame(raf);
      if (!playing) return;
      slideStartedAt = performance.now();
      timer = setTimeout(next, remainingMs);
      tick();
    }

    function tick() {
      const elapsed = performance.now() - slideStartedAt;
      const duration = SLIDES[current].duration;
      const progress = Math.min(1, elapsed / duration);
      bar.style.width = (progress * 100).toFixed(2) + "%";
      remainingEl.textContent = Math.max(0, Math.ceil((duration - elapsed) / 1000)) + "s";
      if (playing) raf = requestAnimationFrame(tick);
    }

    function updateHud() {
      idxEl.textContent = current + 1;
      playPause.textContent = playing ? "Pausa" : "Continuar";
      playPause.setAttribute("aria-pressed", String(playing));
      setMuted(muted);
    }

    async function begin(forceMuted) {
      setMuted(forceMuted);
      if (!muted) {
        try {
          await audio.play();
        } catch (error) {
          setMuted(true);
        }
      }
      if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
      gate.classList.add("hidden");
      gate.setAttribute("aria-hidden", "true");
      playing = true;
      remainingMs = SLIDES[current].duration;
      resumeActiveScene();
      preloadNext();
      schedule();
      updateHud();
    }

    document.getElementById("next").addEventListener("click", () => showSlide(Math.min(SLIDES.length - 1, current + 1), true));
    document.getElementById("prev").addEventListener("click", previous);
    playPause.addEventListener("click", () => {
      playing = !playing;
      if (playing) {
        resumeActiveScene();
        schedule();
      } else {
        clearTimeout(timer);
        cancelAnimationFrame(raf);
        pauseActiveScene();
        remainingMs = Math.max(500, SLIDES[current].duration - (performance.now() - slideStartedAt));
      }
      updateHud();
    });
    mute.addEventListener("click", () => setMuted(!muted));
    document.getElementById("start").addEventListener("click", () => begin(prefersQuiet));
    document.getElementById("startMuted").addEventListener("click", () => begin(true));
    addEventListener("pagehide", () => {
      audio.pause();
      audio.currentTime = 0;
    });
    addEventListener("beforeunload", () => {
      audio.pause();
      audio.currentTime = 0;
    });
  </script>
</body>
</html>
